name: Drill Soak

on:
  workflow_dispatch:

jobs:
  soak-job:
    runs-on: ubuntu-latest
    steps:
      - name: Soak for 20 minutes
        run: |
          echo "Starting 20-minute soak run for the incident drill."
          echo "Started at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 1200
          echo "Soak complete at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
